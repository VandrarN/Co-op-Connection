name: Build and deploy Co-op Connection

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygbag
        run: pip install pygbag

      - name: Show repo files before build
        run: |
          echo "=== REPO FILES ==="
          find . -maxdepth 3 -type f | sort

      - name: Build portrait web game
        run: python -m pygbag --build --width 900 --height 1350 .

      - name: Show build output after build
        run: |
          echo "=== BUILD FILES ==="
          find build -type f | sort

      - name: Show archive contents
        run: |
          echo "=== ARCHIVE CONTENTS ==="
          tar -tzf build/web/co-op-connection.tar.gz | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
