name: Build and deploy Co-op Connection

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygbag
        run: pip install pygbag

      - name: Build game
        run: python -m pygbag --build --html --width 900 --height 1350 --ume_block 0 --CONSOLE 0 .

      - name: Show build output
        run: find build -maxdepth 4 -type f | sort

      - name: Ensure expected archive filename exists
        run: |
          ARCHIVE_FILE=$(find build/web -name "*.tar.gz" | head -n 1)
          echo "Found archive: $ARCHIVE_FILE"
          if [ -z "$ARCHIVE_FILE" ]; then
            echo "No .tar.gz archive found in build/web"
            exit 1
          fi
          cp "$ARCHIVE_FILE" build/web/co-op-connection.tar.gz

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
